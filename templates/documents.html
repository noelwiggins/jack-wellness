<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jack's Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F6F9F6;--bg2:#FFFFFF;--bg3:#EEF4EF;
  --card:#FFFFFF;--card2:#F2F7F3;
  --border:#DCE7DD;--border2:#C2D6C4;
  --green:#2E8B4F;--green2:#26703F;--green3:#1E5A32;
  --green-glow:rgba(46,139,79,0.12);
  --amber:#B8792A;--amber2:#96611F;
  --amber-glow:rgba(184,121,42,0.12);
  --red:#C1392B;--red2:#9C2E22;
  --blue:#2570A8;--blue-glow:rgba(37,112,168,.12);
  --text:#1A2A1D;--text2:#44594A;--text3:#6F8573;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{position:sticky;top:0;z-index:100;background:rgba(246,249,246,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:var(--green);flex:1;letter-spacing:-.3px;text-align:center}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.3px}
.nav-back:hover{color:var(--green);border-color:var(--green3)}

.wrap{padding:14px;max-width:680px;margin:0 auto}
.page-head{margin-bottom:16px}
.page-title{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--text);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.3px}

.status-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.status-sub{font-size:11.5px;color:var(--text3);line-height:1.6;margin-bottom:10px}
.btn{border:none;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;text-decoration:none;color:var(--text)}
.btn-call{background:var(--green-glow);color:var(--green);border:1px solid rgba(76,175,107,.3)}
.btn-call:hover{background:rgba(76,175,107,.25)}
.btn-site{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(91,168,216,.3)}
.btn-site:hover{background:rgba(91,168,216,.25)}
.btn-cal{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2)}
.btn-cal:hover{color:var(--text);border-color:var(--green3)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.doc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.doc-icon{width:32px;height:32px;flex-shrink:0;border-radius:6px}
.doc-icon-fallback{width:32px;height:32px;flex-shrink:0;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px}
.doc-view-btn{background:var(--green-glow);color:var(--green);border:1px solid rgba(76,175,107,.3);border-radius:8px;padding:7px 10px;font-size:10.5px;font-weight:700;font-family:'JetBrains Mono',monospace;text-decoration:none;flex-shrink:0}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:12px}

.mode-toggle{display:flex;gap:6px;margin-bottom:10px;background:var(--bg3);border-radius:10px;padding:4px}
.mode-btn{flex:1;background:none;border:none;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text3);cursor:pointer;transition:all .15s}
.mode-btn.active{background:var(--card2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px}
.search-row input:focus{outline:none;border-color:var(--green3)}

.filter-edit-toggle{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;cursor:pointer;text-decoration:underline;margin-bottom:8px;display:inline-block}
.filter-edit-box{margin-top:6px;margin-bottom:12px}
.filter-edit-box textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.5;resize:vertical;min-height:80px}
.filter-edit-box textarea:focus{outline:none;border-color:var(--green3)}
.filter-edit-actions{display:flex;gap:8px;margin-top:6px}
.filter-status{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:6px;font-weight:700}
.filter-status.error{color:var(--red)}
.filter-status.success{color:var(--green)}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-back" onclick="window.location.href='/'">💼 CAREER</button>
  <div class="nav-logo">Documents</div>
  <button class="nav-back" onclick="window.location.href='/videos'">🎬 VIDEOS</button>
  <button class="nav-back" onclick="window.location.href='/wellness'">🌿 WELLNESS</button>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">Documents</div>
    <div class="page-sub">Passport, CV, and other essentials — pulled from Google Drive</div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-sub" id="statusSub">Checking connection…</div>
    <div id="statusBody"></div>
  </div>

  <div id="docsContainer"></div>
</div>

<script>
function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function fmtSize(bytes){
  if(!bytes) return '';
  const n = parseInt(bytes, 10);
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

let docsMode = 'filtered';
let docsSearchTerm = '';

function switchDocsMode(mode){
  docsMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const filteredInfo = document.getElementById('filteredModeInfo');
  const filteredEditToggle = document.getElementById('filteredModeEditToggle');
  const filterBox = document.getElementById('filterEditBox');
  const allInfo = document.getElementById('allModeInfo');
  const searchBox = document.getElementById('searchModeBox');

  if(filteredInfo) filteredInfo.style.display = mode === 'filtered' ? 'block' : 'none';
  if(filteredEditToggle) filteredEditToggle.style.display = mode === 'filtered' ? 'inline-block' : 'none';
  if(filterBox && mode !== 'filtered') filterBox.style.display = 'none';
  if(allInfo) allInfo.style.display = mode === 'all' ? 'block' : 'none';
  if(searchBox) searchBox.style.display = mode === 'search' ? 'block' : 'none';

  if(mode !== 'search'){
    loadDocuments();
  } else {
    const container = document.getElementById('docsContainer');
    if(container) container.innerHTML = '<div class="empty-state">Type a search term above and tap Go.</div>';
  }
}

function runDocsSearch(){
  const input = document.getElementById('docsSearchInput');
  docsSearchTerm = input ? input.value.trim() : '';
  loadDocuments();
}

function toggleFilterEditor(){
  const box = document.getElementById('filterEditBox');
  if(box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

async function loadDocFilterIntoEditor(){
  try{
    const res = await fetch('/api/career/documents-filter');
    const data = await res.json();
    const input = document.getElementById('docFilterQueryInput');
    if(input) input.value = data.query;
  }catch(e){}
}

async function saveDocFilter(){
  const input = document.getElementById('docFilterQueryInput');
  const status = document.getElementById('docFilterSaveStatus');
  if(!input || !input.value.trim()){
    alert('The filter can\'t be empty. Use the "All" tab to see everything unfiltered, or the "Search" tab for a one-off keyword.');
    if(status){ status.textContent = '⚠ Not saved — filter cannot be empty.'; status.className = 'filter-status error'; }
    return;
  }
  try{
    await fetch('/api/career/documents-filter', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query: input.value.trim()})
    });
    if(status){ status.textContent = '✓ Saved — refreshing results...'; status.className = 'filter-status success'; }
    loadDocuments();
  }catch(e){
    if(status){ status.textContent = '✗ Could not save filter.'; status.className = 'filter-status error'; }
  }
}

async function resetDocFilter(){
  try{
    const res = await fetch('/api/career/documents-filter/reset', {method:'POST'});
    const data = await res.json();
    const input = document.getElementById('docFilterQueryInput');
    if(input) input.value = data.query;
    const status = document.getElementById('docFilterSaveStatus');
    if(status){ status.textContent = '✓ Reset to default — refreshing results...'; status.className = 'filter-status success'; }
    loadDocuments();
  }catch(e){}
}

async function loadDocuments(){
  const statusSub = document.getElementById('statusSub');
  const statusBody = document.getElementById('statusBody');
  const container = document.getElementById('docsContainer');

  if(docsMode === 'search' && !docsSearchTerm){
    container.innerHTML = '<div class="empty-state">Type a search term above and tap Go.</div>';
    return;
  }
  container.innerHTML = '<div class="loading">⟳ Loading documents...</div>';

  try{
    const params = new URLSearchParams({mode: docsMode});
    if(docsMode === 'search') params.set('q', docsSearchTerm);
    const res = await fetch('/api/career/documents?' + params.toString());
    const data = await res.json();

    if(!data.connected){
      statusSub.innerHTML = `Not connected yet. Documents use the same Google account as Gmail — connect it from the Career Office page first.`;
      statusBody.innerHTML = `<a class="btn btn-call" href="/">← Go connect Gmail/Drive on Career Office</a>`;
      statusBody.dataset.built = '';
      container.innerHTML = '';
      return;
    }

    if(data.needs_enable_api){
      statusSub.innerHTML = `Connected with the right permissions — but the Google Drive API itself hasn't been turned on yet in the Google Cloud project. This is a one-time setup step, not a reconnect issue.`;
      statusBody.innerHTML = `
        ${data.enable_url ? `<a class="btn btn-call" href="${esc(data.enable_url)}" target="_blank" rel="noopener">🔧 Enable Drive API in Google Cloud</a>` : ''}
        <button class="btn btn-cal" onclick="loadDocuments()">🔄 Retry after enabling</button>
        <div class="status-sub" style="margin-top:10px">After enabling, it can take a minute or two to propagate — then tap Retry.</div>`;
      statusBody.dataset.built = '';
      container.innerHTML = '';
      return;
    }

    if(data.needs_reauth){
      statusSub.innerHTML = `Connected, but Drive access wasn't granted yet (this connection predates Drive support). Reconnect once to add Drive read access.`;
      statusBody.innerHTML = `<a class="btn btn-call" href="/auth/gmail/connect">🔗 Reconnect for Drive access</a>`;
      statusBody.dataset.built = '';
      container.innerHTML = '';
      return;
    }

    if(data.error){
      statusSub.innerHTML = `Connected, but couldn't load files: ${esc(data.error)}`;
      statusBody.innerHTML = `<button class="btn btn-cal" onclick="loadDocuments()">🔄 Retry</button>`;
      statusBody.dataset.built = '';
      container.innerHTML = '';
      return;
    }

    if(!statusBody.dataset.built){
      statusSub.innerHTML = `Connected. Choose how to browse your Drive files below.`;
      statusBody.innerHTML = `
        <div class="mode-toggle" id="docsModeToggle">
          <button class="mode-btn" data-mode="all" onclick="switchDocsMode('all')">📥 All</button>
          <button class="mode-btn active" data-mode="filtered" onclick="switchDocsMode('filtered')">🎯 Filtered</button>
          <button class="mode-btn" data-mode="search" onclick="switchDocsMode('search')">🔍 Search</button>
        </div>
        <div class="status-sub" id="filteredModeInfo" style="margin-bottom:6px">Showing files matching passport, CV, resume, transcript, certificate, and similar keywords.</div>
        <span class="filter-edit-toggle" id="filteredModeEditToggle" onclick="toggleFilterEditor()">✏️ Edit filter</span>
        <div class="filter-edit-box" id="filterEditBox" style="display:none">
          <div class="status-sub" style="padding:0 0 8px 0">Uses real Google Drive query syntax (e.g. <code>name contains 'CV'</code>). Can't be empty — use "All" or "Search" tabs to broaden instead.</div>
          <textarea id="docFilterQueryInput" placeholder="Drive query syntax, e.g. name contains 'resume'"></textarea>
          <div class="filter-edit-actions">
            <button class="btn btn-cal" onclick="saveDocFilter()">💾 Save Filter</button>
            <button class="btn btn-cal" onclick="resetDocFilter()">↺ Reset to Default</button>
          </div>
          <div class="filter-status" id="docFilterSaveStatus"></div>
        </div>
        <div class="status-sub" id="allModeInfo" style="margin-bottom:10px;display:none">Showing all Drive files, unfiltered, most recent first.</div>
        <div id="searchModeBox" style="display:none;margin-bottom:10px">
          <div class="search-row">
            <input type="text" id="docsSearchInput" placeholder="e.g. transcript, or a filename" onkeydown="if(event.key==='Enter') runDocsSearch()">
            <button class="btn btn-call" onclick="runDocsSearch()">Go</button>
          </div>
        </div>
        <button class="btn btn-cal" onclick="loadDocuments()">🔄 Refresh</button>`;
      statusBody.dataset.built = 'true';
      loadDocFilterIntoEditor();
    }

    if(!data.files || !data.files.length){
      const emptyMsg = docsMode === 'all' ? 'No files found in Drive.'
        : docsMode === 'search' ? 'No files matched that search.'
        : 'No matching documents found in Drive yet.';
      container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
      return;
    }

    container.innerHTML = data.files.map(f => `
      <div class="doc-card">
        ${f.iconLink ? `<img class="doc-icon" src="${esc(f.iconLink)}">` : `<div class="doc-icon-fallback">📄</div>`}
        <div class="doc-info">
          <div class="doc-name">${esc(f.name)}</div>
          <div class="doc-meta">${fmtDate(f.modifiedTime)}${f.size ? ' · ' + fmtSize(f.size) : ''}</div>
        </div>
        <a class="doc-view-btn" href="${esc(f.webViewLink)}" target="_blank" rel="noopener">View</a>
      </div>`).join('');
  }catch(e){
    statusSub.textContent = 'Could not check connection status.';
    container.innerHTML = '';
  }
}

loadDocuments();
</script>
</body>
</html>
