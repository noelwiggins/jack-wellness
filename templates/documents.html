<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jack's Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0D1410;--bg2:#111815;--bg3:#161E18;
  --card:#1A241C;--card2:#1F2B21;
  --border:#2A3D2C;--border2:#344D36;
  --green:#4CAF6B;--green2:#3D9558;--green3:#2A6B3E;
  --green-glow:rgba(76,175,107,0.15);
  --amber:#E8A84A;--amber2:#C8853A;
  --amber-glow:rgba(232,168,74,0.12);
  --red:#E05050;--red2:#B83030;
  --blue:#5BA8D8;--blue-glow:rgba(91,168,216,.15);
  --text:#E8F0E9;--text2:#9BB09D;--text3:#6A8A6C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,20,16,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:var(--green);flex:1;letter-spacing:-.3px;text-align:center}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.3px}
.nav-back:hover{color:var(--green);border-color:var(--green3)}

.wrap{padding:14px;max-width:680px;margin:0 auto}
.page-head{margin-bottom:16px}
.page-title{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--text);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.3px}

.status-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.status-sub{font-size:11.5px;color:var(--text3);line-height:1.6;margin-bottom:10px}
.btn{border:none;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;text-decoration:none;color:var(--text)}
.btn-call{background:var(--green-glow);color:var(--green);border:1px solid rgba(76,175,107,.3)}
.btn-call:hover{background:rgba(76,175,107,.25)}
.btn-site{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(91,168,216,.3)}
.btn-site:hover{background:rgba(91,168,216,.25)}
.btn-cal{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2)}
.btn-cal:hover{color:var(--text);border-color:var(--green3)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.doc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.doc-icon{width:32px;height:32px;flex-shrink:0;border-radius:6px}
.doc-icon-fallback{width:32px;height:32px;flex-shrink:0;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px}
.doc-view-btn{background:var(--green-glow);color:var(--green);border:1px solid rgba(76,175,107,.3);border-radius:8px;padding:7px 10px;font-size:10.5px;font-weight:700;font-family:'JetBrains Mono',monospace;text-decoration:none;flex-shrink:0}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:12px}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-back" onclick="window.location.href='/'">💼 CAREER</button>
  <div class="nav-logo">Documents</div>
  <button class="nav-back" onclick="window.location.href='/wellness'">🌿 WELLNESS</button>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">Documents</div>
    <div class="page-sub">Passport, CV, and other essentials — pulled from Google Drive</div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-sub" id="statusSub">Checking connection…</div>
    <div id="statusBody"></div>
  </div>

  <div id="docsContainer"></div>
</div>

<script>
function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function fmtSize(bytes){
  if(!bytes) return '';
  const n = parseInt(bytes, 10);
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

async function loadDocuments(){
  const statusSub = document.getElementById('statusSub');
  const statusBody = document.getElementById('statusBody');
  const container = document.getElementById('docsContainer');
  container.innerHTML = '<div class="loading">⟳ Loading documents...</div>';

  try{
    const res = await fetch('/api/career/documents');
    const data = await res.json();

    if(!data.connected){
      statusSub.innerHTML = `Not connected yet. Documents use the same Google account as Gmail — connect it from the Career Office page first.`;
      statusBody.innerHTML = `<a class="btn btn-call" href="/">← Go connect Gmail/Drive on Career Office</a>`;
      container.innerHTML = '';
      return;
    }

    if(data.needs_enable_api){
      statusSub.innerHTML = `Connected with the right permissions — but the Google Drive API itself hasn't been turned on yet in the Google Cloud project. This is a one-time setup step, not a reconnect issue.`;
      statusBody.innerHTML = `
        ${data.enable_url ? `<a class="btn btn-call" href="${esc(data.enable_url)}" target="_blank" rel="noopener">🔧 Enable Drive API in Google Cloud</a>` : ''}
        <button class="btn btn-cal" onclick="loadDocuments()">🔄 Retry after enabling</button>
        <div class="status-sub" style="margin-top:10px">After enabling, it can take a minute or two to propagate — then tap Retry.</div>`;
      container.innerHTML = '';
      return;
    }

    if(data.needs_reauth){
      statusSub.innerHTML = `Connected, but Drive access wasn't granted yet (this connection predates Drive support). Reconnect once to add Drive read access.`;
      statusBody.innerHTML = `<a class="btn btn-call" href="/auth/gmail/connect">🔗 Reconnect for Drive access</a>`;
      container.innerHTML = '';
      return;
    }

    if(data.error){
      statusSub.innerHTML = `Connected, but couldn't load files: ${esc(data.error)}`;
      statusBody.innerHTML = `<button class="btn btn-cal" onclick="loadDocuments()">🔄 Retry</button>`;
      container.innerHTML = '';
      return;
    }

    statusSub.innerHTML = `Connected. Showing Drive files matching passport, CV, resume, transcript, certificate, and similar keywords.`;
    statusBody.innerHTML = `<button class="btn btn-cal" onclick="loadDocuments()">🔄 Refresh</button>`;

    if(!data.files || !data.files.length){
      container.innerHTML = '<div class="empty-state">No matching documents found in Drive yet.</div>';
      return;
    }

    container.innerHTML = data.files.map(f => `
      <div class="doc-card">
        ${f.iconLink ? `<img class="doc-icon" src="${esc(f.iconLink)}">` : `<div class="doc-icon-fallback">📄</div>`}
        <div class="doc-info">
          <div class="doc-name">${esc(f.name)}</div>
          <div class="doc-meta">${fmtDate(f.modifiedTime)}${f.size ? ' · ' + fmtSize(f.size) : ''}</div>
        </div>
        <a class="doc-view-btn" href="${esc(f.webViewLink)}" target="_blank" rel="noopener">View</a>
      </div>`).join('');
  }catch(e){
    statusSub.textContent = 'Could not check connection status.';
    container.innerHTML = '';
  }
}

loadDocuments();
</script>
</body>
</html>
