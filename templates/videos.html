<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jack's Career Resources</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F6F9F6;--bg2:#FFFFFF;--bg3:#EEF4EF;
  --card:#FFFFFF;--card2:#F2F7F3;
  --border:#DCE7DD;--border2:#C2D6C4;
  --green:#2E8B4F;--green2:#26703F;--green3:#1E5A32;
  --green-glow:rgba(46,139,79,0.12);
  --amber:#B8792A;--amber2:#96611F;
  --amber-glow:rgba(184,121,42,0.12);
  --red:#C1392B;--red2:#9C2E22;
  --blue:#2570A8;--blue-glow:rgba(37,112,168,.12);
  --text:#1A2A1D;--text2:#44594A;--text3:#6F8573;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{position:sticky;top:0;z-index:100;background:rgba(246,249,246,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:var(--green);flex:1;letter-spacing:-.3px;text-align:center}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.3px}
.nav-back:hover{color:var(--green);border-color:var(--green3)}

.wrap{padding:14px;max-width:680px;margin:0 auto}
.page-head{margin-bottom:16px}
.page-title{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--text);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.3px}

.btn{border:none;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;text-decoration:none;color:var(--text)}
.btn-call{background:var(--green-glow);color:var(--green);border:1px solid rgba(46,139,79,.3)}
.btn-call:hover{background:rgba(46,139,79,.22)}
.btn-site{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(37,112,168,.3)}
.btn-site:hover{background:rgba(37,112,168,.22)}
.btn-cal{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.btn-cal:hover{color:var(--text);border-color:var(--green3)}
.btn-danger{background:var(--red-glow, rgba(193,57,43,.1));color:var(--red);border:1px solid rgba(193,57,43,.3)}
.btn-danger:hover{background:rgba(193,57,43,.2)}

.add-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px}
.add-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-bottom:4px}
.add-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
.chevron{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.collapsible-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.collapsible-body.open{max-height:1000px}
.add-field{margin-bottom:10px}
.add-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:4px}
.add-field input,.add-field textarea,.add-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px}
.add-field textarea{min-height:70px;resize:vertical;line-height:1.5}
.add-field input:focus,.add-field textarea:focus,.add-field select:focus{outline:none;border-color:var(--green3)}
.add-type-toggle{display:flex;gap:6px;margin-bottom:12px;background:var(--bg3);border-radius:10px;padding:4px}
.type-btn{flex:1;background:none;border:none;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text3);cursor:pointer}
.type-btn.active{background:var(--card2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.add-status{font-size:10.5px;font-family:'JetBrains Mono',monospace;margin-top:8px;min-height:14px;font-weight:700}
.add-status.error{color:var(--red)}
.add-status.success{color:var(--green)}

.resource-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.resource-thumb-wrap{position:relative;border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--bg3)}
.resource-thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.resource-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;pointer-events:none}
.resource-doc-icon{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bg3);border-radius:10px;margin-bottom:10px}
.resource-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3}
.resource-synopsis{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.resource-actions{display:flex;gap:8px;flex-wrap:wrap}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:12px}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-back" onclick="window.location.href='/'">💼 CAREER</button>
  <div class="nav-logo">Career Resources</div>
  <button class="nav-back" onclick="window.location.href='/documents'">📁 DOCS</button>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">Instructional Videos &amp; Resources</div>
    <div class="page-sub">Mindset, interview prep, and job-search material</div>
  </div>

  <div class="add-card">
    <div class="add-head" onclick="toggleCollapse('addResourceBody')">
      <span class="add-title">➕ Add a video or document</span>
      <span class="chevron" id="addResourceBody-chevron">▾</span>
    </div>
    <div class="collapsible-body" id="addResourceBody">
      <div class="add-type-toggle" id="addTypeToggle">
        <button class="type-btn active" data-type="video" onclick="setResourceType('video')">🎬 Video</button>
        <button class="type-btn" data-type="doc" onclick="setResourceType('doc')">📄 Doc / Link</button>
      </div>
      <div class="add-field">
        <label>Title</label>
        <input type="text" id="newResourceTitle" placeholder="e.g. How to Answer 'Tell Me About Yourself'">
      </div>
      <div class="add-field">
        <label id="newResourceUrlLabel">YouTube URL</label>
        <input type="text" id="newResourceUrl" placeholder="https://youtu.be/...">
      </div>
      <div class="add-field">
        <label>Short synopsis (optional)</label>
        <textarea id="newResourceSynopsis" placeholder="What is this about, and why is it useful?"></textarea>
      </div>
      <button class="btn btn-call" onclick="submitResource()">💾 Add to list</button>
      <div class="add-status" id="addResourceStatus"></div>
    </div>
  </div>

  <div id="resourcesContainer">
    <div class="loading">⟳ Loading resources...</div>
  </div>
</div>

<script>
let RESOURCES = [];
let newResourceType = 'video';

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function toggleCollapse(id){
  const el = document.getElementById(id);
  const chevron = document.getElementById(id+'-chevron');
  if(!el) return;
  el.classList.toggle('open');
  if(chevron) chevron.classList.toggle('open');
}

function setResourceType(type){
  newResourceType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.getElementById('newResourceUrlLabel').textContent = type === 'video' ? 'YouTube URL' : 'Document / Link URL';
  document.getElementById('newResourceUrl').placeholder = type === 'video' ? 'https://youtu.be/...' : 'https://...';
}

async function loadResources(){
  const container = document.getElementById('resourcesContainer');
  try{
    const res = await fetch('/api/career/resources');
    RESOURCES = await res.json();
    render();
  }catch(e){
    container.innerHTML = '<div class="empty-state">Could not load resources.</div>';
  }
}

function render(){
  const container = document.getElementById('resourcesContainer');
  if(!RESOURCES.length){
    container.innerHTML = '<div class="empty-state">No resources yet — add one above.</div>';
    return;
  }
  container.innerHTML = RESOURCES.map(r => {
    const isVideo = r.resource_type === 'video';
    const thumb = isVideo && r.youtube_id
      ? `<div class="resource-thumb-wrap" onclick="window.open('${esc(r.url)}','_blank')">
           <img class="resource-thumb" src="https://img.youtube.com/vi/${esc(r.youtube_id)}/hqdefault.jpg">
           <div class="resource-play">▶</div>
         </div>`
      : isVideo
        ? `<div class="resource-doc-icon">🎬</div>`
        : `<div class="resource-doc-icon">📄</div>`;
    return `
      <div class="resource-card">
        ${thumb}
        <div class="resource-title">${esc(r.title)}</div>
        ${r.synopsis ? `<div class="resource-synopsis">${esc(r.synopsis)}</div>` : ''}
        <div class="resource-actions">
          <a class="btn btn-call" href="${esc(r.url)}" target="_blank" rel="noopener">${isVideo ? '▶️ Watch' : '🔗 Open'}</a>
          <button class="btn btn-danger" onclick="deleteResource(${r.id})">🗑 Remove</button>
        </div>
      </div>`;
  }).join('');
}

async function submitResource(){
  const title = document.getElementById('newResourceTitle').value.trim();
  const url = document.getElementById('newResourceUrl').value.trim();
  const synopsis = document.getElementById('newResourceSynopsis').value.trim();
  const status = document.getElementById('addResourceStatus');

  if(!title || !url){
    status.textContent = '⚠ Title and URL are required.';
    status.className = 'add-status error';
    return;
  }

  try{
    const res = await fetch('/api/career/resources', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({resource_type: newResourceType, title, url, synopsis})
    });
    const data = await res.json();
    if(!res.ok || data.error){
      status.textContent = '✗ ' + (data.error || 'Could not add.');
      status.className = 'add-status error';
      return;
    }
    status.textContent = '✓ Added!';
    status.className = 'add-status success';
    document.getElementById('newResourceTitle').value = '';
    document.getElementById('newResourceUrl').value = '';
    document.getElementById('newResourceSynopsis').value = '';
    RESOURCES.push(data);
    render();
  }catch(e){
    status.textContent = '✗ Could not add resource.';
    status.className = 'add-status error';
  }
}

async function deleteResource(id){
  if(!confirm('Remove this from the list?')) return;
  try{
    await fetch(`/api/career/resources/${id}`, {method: 'DELETE'});
    RESOURCES = RESOURCES.filter(r => r.id !== id);
    render();
  }catch(e){}
}

loadResources();
</script>

<footer style="text-align:center;padding:1.5rem 1rem;font-size:0.72rem;color:#888;font-family:monospace;border-top:1px solid #eee;margin-top:2rem">© 2026 Noel Wiggins · All rights reserved</footer>
</body>
</html>
