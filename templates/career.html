<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jack's Career Office</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#0D1410;--bg2:#111815;--bg3:#161E18;
  --card:#1A241C;--card2:#1F2B21;
  --border:#2A3D2C;--border2:#344D36;
  --green:#4CAF6B;--green2:#3D9558;--green3:#2A6B3E;
  --green-glow:rgba(76,175,107,0.15);
  --amber:#E8A84A;--amber2:#C8853A;
  --amber-glow:rgba(232,168,74,0.12);
  --red:#E05050;--red2:#B83030;
  --blue:#5BA8D8;--blue-glow:rgba(91,168,216,.15);
  --text:#E8F0E9;--text2:#9BB09D;--text3:#6A8A6C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,20,16,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:var(--green);flex:1;letter-spacing:-.3px}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.3px}
.nav-back:hover{color:var(--green);border-color:var(--green3)}

.wrap{padding:14px;max-width:680px;margin:0 auto}
.page-head{margin-bottom:16px}
.page-title{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--text);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.3px}

.progress-strip{display:flex;gap:8px;margin-bottom:16px}
.progress-pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.progress-pill-num{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--green);font-weight:500}
.progress-pill-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.cat-head{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px}
.cat-head::after{content:'';flex:1;height:1px;background:var(--border)}

.lead-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.lead-card.done{border-color:var(--green3);background:linear-gradient(180deg,var(--card2),var(--card))}
.lead-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.lead-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);background:var(--bg3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:all .15s;margin-top:2px}
.lead-check.checked{background:var(--green-glow);border-color:var(--green);color:var(--green)}
.lead-title-block{flex:1;min-width:0}
.lead-org{font-size:15px;font-weight:700;color:var(--text)}
.lead-role{font-size:12px;color:var(--green);margin-top:1px}
.lead-pay{font-size:10px;color:var(--amber);font-family:'JetBrains Mono',monospace;margin-top:4px}
.lead-info{font-size:12px;color:var(--text2);line-height:1.55;margin:10px 0;padding:10px;background:var(--bg3);border-radius:10px}

.lead-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:none;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;text-decoration:none;color:var(--text)}
.btn-call{background:var(--green-glow);color:var(--green);border:1px solid rgba(76,175,107,.3)}
.btn-call:hover{background:rgba(76,175,107,.25)}
.btn-site{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(91,168,216,.3)}
.btn-site:hover{background:rgba(91,168,216,.25)}
.btn-apply{background:var(--amber-glow);color:var(--amber);border:1px solid rgba(232,168,74,.3)}
.btn-apply:hover{background:rgba(232,168,74,.25)}
.btn-cal{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2)}
.btn-cal:hover{color:var(--text);border-color:var(--green3)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.date-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:4px}
.date-field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;color-scheme:dark}
.date-field input:focus{outline:none;border-color:var(--green3)}

.notes-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:4px}
.notes-field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;resize:vertical;min-height:52px}
.notes-field textarea:focus{outline:none;border-color:var(--green3)}
.save-status{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:5px;height:12px;letter-spacing:.3px}
.save-status.saved{color:var(--green)}

.dialer-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.dialer-modal.open{display:flex}
.dialer-sheet{background:var(--card2);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:420px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.dialer-org{font-size:12px;color:var(--text3);text-align:center;margin-bottom:4px;font-family:'JetBrains Mono',monospace;letter-spacing:.3px}
.dialer-number{font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--text);text-align:center;margin-bottom:18px;letter-spacing:1px}
.dialer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.dialer-key{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--text);cursor:pointer;user-select:none}
.dialer-key:active{background:var(--green-glow)}
.dialer-key-sub{display:block;font-size:8px;color:var(--text3);margin-top:1px;letter-spacing:1px}
.dialer-btns{display:flex;gap:10px}
.dialer-call-btn{flex:1;background:var(--green);color:#0D1410;border:none;border-radius:14px;padding:14px;font-weight:800;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.5px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.dialer-close-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:14px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer}

.gmail-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px}
.gmail-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.gmail-icon{font-size:20px}
.gmail-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
.gmail-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.gmail-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.gmail-sub{font-size:11px;color:var(--text3);margin-bottom:4px;line-height:1.5}
.gmail-filter-tag{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);margin-top:6px}
.gmail-msg{background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.gmail-msg-subject{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.gmail-msg-from{font-size:10.5px;color:var(--blue);margin-bottom:4px}
.gmail-msg-snippet{font-size:11.5px;color:var(--text2);line-height:1.4}
.gmail-msg-date{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:4px}
.gmail-msg-link{font-size:10px;color:var(--green);text-decoration:none;font-family:'JetBrains Mono',monospace;margin-top:4px;display:inline-block}
.gmail-empty{font-size:11.5px;color:var(--text3);text-align:center;padding:16px 0}

.chevron{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.collapsible-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.collapsible-body.open{max-height:6000px}

.cat-head-collapsible{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:10px 2px;margin-top:14px;border-bottom:1px solid var(--border)}
.cat-head-collapsible-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace;flex:1}
.cat-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);background:var(--bg3);border-radius:10px;padding:2px 8px}

.map-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.map-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.map-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
.map-legend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.map-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.map-legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.map-legend-dot.live{background:var(--amber);box-shadow:0 0 4px var(--amber)}
.map-legend-dot.cafe{background:var(--green);box-shadow:0 0 4px var(--green)}
.map-legend-dot.boutique{background:var(--blue);box-shadow:0 0 4px var(--blue)}
.map-legend-dot.bar{background:var(--red);box-shadow:0 0 4px var(--red)}
#parkSlopeMap{height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.leaflet-popup-content-wrapper{background:var(--card2);color:var(--text);border-radius:12px;border:1px solid var(--border2)}
.leaflet-popup-tip{background:var(--card2)}
.leaflet-popup-content{margin:12px 14px;font-family:'Nunito',sans-serif;min-width:190px}
.popup-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.popup-role{font-size:11px;color:var(--green);margin-bottom:6px}
.popup-address{font-size:10.5px;color:var(--text2);margin-bottom:6px;line-height:1.4}
.popup-info{font-size:10.5px;color:var(--text3);margin-bottom:8px;line-height:1.4}
.popup-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.popup-btn{border:none;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;cursor:pointer;text-decoration:none;display:inline-block}
.popup-btn-call{background:var(--green-glow);color:var(--green)}
.popup-btn-site{background:var(--blue-glow);color:var(--blue)}
.popup-visited-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.popup-visited-row input{width:14px;height:14px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:12px}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-back" onclick="window.location.href='/wellness'">🌿 WELLNESS</button>
  <div class="nav-logo">Career Office</div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">Job Search Command Center</div>
    <div class="page-sub" id="pageDate">—</div>
  </div>

  <div class="map-section">
    <div class="map-head">
      <span class="map-title">🗺️ Park Slope Job Map</span>
    </div>
    <div class="map-legend">
      <span class="map-legend-item"><span class="map-legend-dot live"></span>Live Posting</span>
      <span class="map-legend-item"><span class="map-legend-dot cafe"></span>Cafe (walk-in)</span>
      <span class="map-legend-item"><span class="map-legend-dot boutique"></span>Boutique (walk-in)</span>
      <span class="map-legend-item"><span class="map-legend-dot bar"></span>Bar/Restaurant (walk-in)</span>
    </div>
    <div id="parkSlopeMap"></div>
  </div>

  <div class="gmail-card" id="gmailCard">
    <div class="gmail-head" onclick="toggleCollapse('gmail-collapsible')">
      <span class="gmail-icon">📬</span>
      <span class="gmail-title">Job Responses (Gmail)</span>
      <span class="gmail-dot" id="gmailDot"></span>
      <span class="chevron" id="gmail-collapsible-chevron">▾</span>
    </div>
    <div class="gmail-sub" id="gmailSub">Checking connection…</div>
    <div class="collapsible-body" id="gmail-collapsible">
      <div id="gmailBody"></div>
    </div>
  </div>

  <div class="progress-strip">
    <div class="progress-pill">
      <div class="progress-pill-num" id="statTotal">0</div>
      <div class="progress-pill-label">Total Leads</div>
    </div>
    <div class="progress-pill">
      <div class="progress-pill-num" id="statApplied">0</div>
      <div class="progress-pill-label">Applied</div>
    </div>
    <div class="progress-pill">
      <div class="progress-pill-num" id="statFollowup">0</div>
      <div class="progress-pill-label">Follow-Ups Set</div>
    </div>
  </div>

  <div id="leadsContainer">
    <div class="loading">⟳ Loading leads...</div>
  </div>
</div>

<div class="dialer-modal" id="dialerModal">
  <div class="dialer-sheet">
    <div class="dialer-org" id="dialerOrg">—</div>
    <div class="dialer-number" id="dialerNumber">—</div>
    <div class="dialer-grid" id="dialerGrid"></div>
    <div class="dialer-btns">
      <a class="dialer-call-btn" id="dialerCallBtn" href="tel:">📞 CALL</a>
      <button class="dialer-close-btn" onclick="closeDialer()">CLOSE</button>
    </div>
  </div>
</div>

<script>
let LEADS = [];
const saveTimers = {};

function fmtDate(d){
  const opts = {weekday:'short', month:'short', day:'numeric', year:'numeric'};
  return d.toLocaleDateString('en-US', opts);
}
document.getElementById('pageDate').textContent = fmtDate(new Date());

async function loadLeads(){
  try{
    const res = await fetch('/api/career/leads');
    LEADS = await res.json();
    render();
  }catch(e){
    document.getElementById('leadsContainer').innerHTML = '<div class="empty-state">Could not load leads. Pull to refresh.</div>';
  }
}

function toggleCollapse(id){
  const el = document.getElementById(id);
  const chevron = document.getElementById(id+'-chevron');
  if(!el) return;
  el.classList.toggle('open');
  if(chevron) chevron.classList.toggle('open');
}

function slugify(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function render(){
  const container = document.getElementById('leadsContainer');
  if(!LEADS.length){
    container.innerHTML = '<div class="empty-state">No leads yet.</div>';
    return;
  }
  document.getElementById('statTotal').textContent = LEADS.length;
  document.getElementById('statApplied').textContent = LEADS.filter(l=>l.checked).length;
  document.getElementById('statFollowup').textContent = LEADS.filter(l=>l.next_contact_date).length;

  const cats = [...new Set(LEADS.map(l=>l.category))];
  let html = '';
  cats.forEach(cat=>{
    const catLeads = LEADS.filter(l=>l.category===cat);
    const appliedCount = catLeads.filter(l=>l.checked).length;
    const catId = 'cat-' + slugify(cat);
    const wasOpen = document.getElementById(catId)?.classList.contains('open');
    html += `<div class="cat-head-collapsible" onclick="toggleCollapse('${catId}')">
      <span class="cat-head-collapsible-label">${esc(cat)}</span>
      <span class="cat-count">${appliedCount}/${catLeads.length} applied</span>
      <span class="chevron${wasOpen ? ' open' : ''}" id="${catId}-chevron">▾</span>
    </div>
    <div class="collapsible-body${wasOpen ? ' open' : ''}" id="${catId}">`;
    catLeads.forEach(lead=>{
      html += renderCard(lead);
    });
    html += `</div>`;
  });
  container.innerHTML = html;
}

function renderCard(lead){
  const phoneClean = (lead.phone||'').replace(/[^\d+]/g,'');
  const canCall = phoneClean.length >= 7;
  return `
  <div class="lead-card ${lead.checked ? 'done':''}" id="card-${lead.id}">
    <div class="lead-top">
      <div class="lead-check ${lead.checked ? 'checked':''}" onclick="toggleChecked(${lead.id})">✓</div>
      <div class="lead-title-block">
        <div class="lead-org">${esc(lead.org_name)}</div>
        <div class="lead-role">${esc(lead.role_title||'')}</div>
        ${lead.pay_range ? `<div class="lead-pay">${esc(lead.pay_range)}</div>` : ''}
      </div>
    </div>
    ${lead.info ? `<div class="lead-info">${esc(lead.info)}</div>` : ''}
    <div class="lead-actions">
      ${canCall ? `<button class="btn btn-call" onclick="openDialer(${lead.id})">📞 Call</button>` : ''}
      ${lead.website ? `<a class="btn btn-site" href="${esc(lead.website)}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
      ${lead.apply_url ? `<a class="btn btn-apply" href="${esc(lead.apply_url)}" target="_blank" rel="noopener">📝 Apply</a>` : ''}
      <button class="btn btn-cal" onclick="addToCalendar(${lead.id})">📅 Add to Calendar</button>
    </div>
    <div class="date-row">
      <div class="date-field">
        <label>Last Contact</label>
        <input type="date" value="${lead.last_contact_date||''}" onchange="updateField(${lead.id},'last_contact_date',this.value)">
      </div>
      <div class="date-field">
        <label>Next Contact</label>
        <input type="date" id="next-${lead.id}" value="${lead.next_contact_date||''}" onchange="updateField(${lead.id},'next_contact_date',this.value)">
      </div>
    </div>
    <div class="notes-field">
      <label>Follow-Up Notes</label>
      <textarea placeholder="e.g. left voicemail, spoke with HR, waiting on interview slot..." oninput="debounceNotes(${lead.id}, this.value)">${esc(lead.follow_up_notes||'')}</textarea>
      <div class="save-status" id="save-${lead.id}"></div>
    </div>
  </div>`;
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

async function patchLead(id, payload){
  const res = await fetch(`/api/career/leads/${id}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  const updated = await res.json();
  const idx = LEADS.findIndex(l=>l.id===id);
  if(idx>-1) LEADS[idx] = updated;
  return updated;
}

async function toggleChecked(id){
  const lead = LEADS.find(l=>l.id===id);
  const newVal = !lead.checked;
  lead.checked = newVal; // optimistic
  render();
  await patchLead(id, {checked:newVal});
}

async function updateField(id, field, value){
  await patchLead(id, {[field]: value});
  render();
}

function debounceNotes(id, value){
  clearTimeout(saveTimers[id]);
  const statusEl = document.getElementById(`save-${id}`);
  if(statusEl){ statusEl.textContent = 'typing...'; statusEl.classList.remove('saved'); }
  saveTimers[id] = setTimeout(async ()=>{
    await patchLead(id, {follow_up_notes: value});
    const el = document.getElementById(`save-${id}`);
    if(el){ el.textContent = '✓ saved'; el.classList.add('saved'); }
  }, 700);
}

// ---- Dialer ----
let dialerLeadId = null;
let dialerDigits = '';
const KEYS = [
  ['1',''],['2','ABC'],['3','DEF'],
  ['4','GHI'],['5','JKL'],['6','MNO'],
  ['7','PQRS'],['8','TUV'],['9','WXYZ'],
  ['*',''],['0','+'],['#','']
];

function openDialer(id){
  const lead = LEADS.find(l=>l.id===id);
  dialerLeadId = id;
  dialerDigits = (lead.phone||'').replace(/[^\d+]/g,'');
  document.getElementById('dialerOrg').textContent = lead.org_name;
  document.getElementById('dialerGrid').innerHTML = KEYS.map(k=>
    `<div class="dialer-key" onclick="dialerPress('${k[0]}')">${k[0]}<span class="dialer-key-sub">${k[1]}</span></div>`
  ).join('');
  updateDialerDisplay();
  document.getElementById('dialerModal').classList.add('open');
}
function dialerPress(k){
  dialerDigits += k;
  updateDialerDisplay();
}
function updateDialerDisplay(){
  document.getElementById('dialerNumber').textContent = dialerDigits || '—';
  document.getElementById('dialerCallBtn').setAttribute('href', 'tel:'+dialerDigits);
}
function closeDialer(){
  document.getElementById('dialerModal').classList.remove('open');
  dialerLeadId = null;
}

// ---- Add to Google Calendar ----
function addToCalendar(id){
  const lead = LEADS.find(l=>l.id===id);
  const dateInput = document.getElementById(`next-${id}`);
  let dateStr = dateInput ? dateInput.value : lead.next_contact_date;
  if(!dateStr){
    alert('Set a "Next Contact" date first, then tap Add to Calendar.');
    return;
  }
  const [y,m,d] = dateStr.split('-');
  const start = `${y}${m}${d}T140000`;
  const end = `${y}${m}${d}T143000`;
  const title = encodeURIComponent(`Follow up: ${lead.org_name} — ${lead.role_title||''}`);
  const details = encodeURIComponent(
    `Career follow-up.\n\nOrg: ${lead.org_name}\nRole: ${lead.role_title||''}\nPhone: ${lead.phone||''}\nWebsite: ${lead.website||''}\n\nNotes:\n${lead.follow_up_notes||''}`
  );
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`;
  window.open(url, '_blank');
}

// ---- Gmail Job Responses ----
async function loadGmailCard(){
  try{
    const res = await fetch('/api/career/gmail-status');
    const status = await res.json();
    const dot = document.getElementById('gmailDot');
    const sub = document.getElementById('gmailSub');
    const body = document.getElementById('gmailBody');

    if(!status.configured){
      dot.classList.remove('on');
      sub.innerHTML = `Not set up yet — tap to see setup steps.`;
      body.innerHTML = `<div class="gmail-empty">Add <b>GOOGLE_CLIENT_ID</b>, <b>GOOGLE_CLIENT_SECRET</b>, and <b>GOOGLE_REDIRECT_URI</b> in Railway variables (from a Google Cloud OAuth client with Gmail API enabled), then reload.</div>
        <button class="btn btn-cal" disabled>🔒 Connect Gmail (needs setup)</button>`;
      return;
    }
    if(!status.connected){
      dot.classList.remove('on');
      sub.innerHTML = `Not connected yet — tap to connect.`;
      body.innerHTML = `<div class="gmail-empty">Authorize <b>${status.email || 'perrywigginsjack@gmail.com'}</b> — read-only access, filtered to job-related mail only.</div>
        <button class="btn btn-call" onclick="window.location.href='/auth/gmail/connect'">🔗 Connect Gmail</button>`;
      return;
    }
    dot.classList.add('on');
    sub.innerHTML = `Connected as <b>${status.email}</b> — tap to view filtered replies.`;
    body.innerHTML = `
      <div class="gmail-sub" style="margin-bottom:10px">Showing employer replies (interviews, application status, offers) — LinkedIn/Indeed job-alert noise and known marketing senders filtered out.<span class="gmail-filter-tag">filter · last 60 days</span></div>
      <div class="lead-actions" style="margin-bottom:12px">
        <button class="btn btn-cal" onclick="loadGmailInbox()">🔄 Refresh</button>
        <button class="btn btn-cal" onclick="disconnectGmail()">🔌 Disconnect</button>
      </div>
      <div id="gmailMessages"><div class="gmail-empty">Loading messages…</div></div>`;
    loadGmailInbox();
  }catch(e){
    document.getElementById('gmailSub').textContent = 'Could not check Gmail connection status.';
  }
}

async function loadGmailInbox(){
  const container = document.getElementById('gmailMessages');
  if(!container) return;
  container.innerHTML = '<div class="gmail-empty">Loading messages…</div>';
  try{
    const res = await fetch('/api/career/gmail-inbox');
    const data = await res.json();
    if(data.error){
      container.innerHTML = `<div class="gmail-empty">Error: ${esc(data.error)}</div>`;
      return;
    }
    if(!data.messages || !data.messages.length){
      container.innerHTML = '<div class="gmail-empty">No job-related emails matched the filter yet.</div>';
      return;
    }
    container.innerHTML = data.messages.map(m => `
      <div class="gmail-msg">
        <div class="gmail-msg-subject">${esc(m.subject)}</div>
        <div class="gmail-msg-from">${esc(m.from)}</div>
        <div class="gmail-msg-snippet">${esc(m.snippet)}</div>
        <div class="gmail-msg-date">${esc(m.date)}</div>
        <a class="gmail-msg-link" href="${esc(m.link)}" target="_blank" rel="noopener">Open in Gmail →</a>
      </div>`).join('');
  }catch(e){
    container.innerHTML = '<div class="gmail-empty">Could not load messages.</div>';
  }
}

async function disconnectGmail(){
  await fetch('/api/career/gmail-disconnect', {method:'POST'});
  loadGmailCard();
}

// ---- Park Slope Job Map ----
let MAP_PINS = [];
let leafletMap = null;

async function loadMapPins(){
  try{
    const res = await fetch('/api/career/map-pins');
    MAP_PINS = await res.json();
    renderMap();
  }catch(e){
    document.getElementById('parkSlopeMap').innerHTML = '<div class="gmail-empty">Could not load map pins.</div>';
  }
}

function pinColor(pin){
  if(pin.status === 'live') return '#E8A84A';
  if(pin.category === 'Cafe') return '#4CAF6B';
  if(pin.category === 'Boutique') return '#5BA8D8';
  if(pin.category === 'Bar') return '#E05050';
  return '#9BB09D';
}

function makeDivIcon(color, checked){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);border:2px solid #0D1410;box-shadow:0 2px 4px rgba(0,0,0,.4);${checked ? 'opacity:0.4' : ''}"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,16],
    popupAnchor: [0,-16]
  });
}

function renderMap(){
  if(!MAP_PINS.length){
    document.getElementById('parkSlopeMap').innerHTML = '<div class="gmail-empty">No pins yet.</div>';
    return;
  }
  if(!leafletMap){
    leafletMap = L.map('parkSlopeMap', {scrollWheelZoom:false}).setView([40.6715, -73.9800], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO',
      maxZoom: 19
    }).addTo(leafletMap);
  }
  MAP_PINS.forEach(pin => {
    if(pin.lat == null || pin.lng == null) return;
    const marker = L.marker([pin.lat, pin.lng], {icon: makeDivIcon(pinColor(pin), pin.checked)}).addTo(leafletMap);
    const phoneClean = (pin.phone||'').replace(/[^\d+]/g,'');
    const statusLabel = pin.status === 'live' ? 'LIVE POSTING' : 'WALK-IN CANDIDATE';
    const popupHtml = `
      <div class="popup-name">${esc(pin.name)}</div>
      <div class="popup-role">${esc(pin.role_title||'')} · ${esc(statusLabel)}</div>
      <div class="popup-address">${esc(pin.address||'')}</div>
      ${pin.info ? `<div class="popup-info">${esc(pin.info)}</div>` : ''}
      <div class="popup-actions">
        ${phoneClean ? `<a class="popup-btn popup-btn-call" href="tel:${phoneClean}">📞 Call</a>` : ''}
        ${pin.website ? `<a class="popup-btn popup-btn-site" href="${esc(pin.website)}" target="_blank" rel="noopener">🌐 Site</a>` : ''}
      </div>
      <label class="popup-visited-row">
        <input type="checkbox" ${pin.checked ? 'checked' : ''} onchange="togglePinVisited(${pin.id}, this.checked)">
        Visited / Applied
      </label>`;
    marker.bindPopup(popupHtml);
  });
}

async function togglePinVisited(id, checked){
  await fetch(`/api/career/map-pins/${id}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({checked})
  });
  const idx = MAP_PINS.findIndex(p=>p.id===id);
  if(idx>-1) MAP_PINS[idx].checked = checked;
  leafletMap.eachLayer(layer => {
    if(layer instanceof L.Marker){
      const ll = layer.getLatLng();
      const pin = MAP_PINS.find(p=>Math.abs(p.lat-ll.lat)<0.00001 && Math.abs(p.lng-ll.lng)<0.00001);
      if(pin && pin.id === id) layer.setIcon(makeDivIcon(pinColor(pin), checked));
    }
  });
}

loadMapPins();
loadGmailCard();
loadLeads();
